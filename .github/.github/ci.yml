name: BugAssistant CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  triage-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Pre-Compile Syntax Validation
      run: |
        # Verifies Python code compiles cleanly without syntax failures
        python -m compileall backend/

  build-container:
    needs: triage-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Verify Docker Build Compilation
      run: |
        cd backend
        docker build -t bugassistant-backend:test .